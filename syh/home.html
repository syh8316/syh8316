<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>新義和歌劇團</title>

  <!-- Icons（社群用） -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- 推薦中文字體（完整字集） -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">

  <!-- 預載音檔（換成你的檔名與路徑） -->
  <link rel="preload" as="audio" href="./audio/bgm.mp3" type="audio/mpeg">

  <!-- 你的 CSS -->
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>

  <!-- Header：桌機顯示連結；手機使用漢堡 -->
  <header class="site-header">
    <a href="#" class="brand" aria-label="新義和歌劇團">新義和歌劇團</a>

    <button class="nav-toggle" id="navToggle" aria-label="開啟選單" aria-expanded="false">
      <span class="nav-toggle__bar"></span>
      <span class="nav-toggle__bar"></span>
      <span class="nav-toggle__bar"></span>
    </button>

    <nav id="siteNav" class="site-nav" aria-label="主選單">
      <ul>
        <li><a href="#about">關於劇團</a></li>
        <li><a href="#history">劇團歷代人物</a></li>
        <li><a href="#contact">聯繫我們</a></li>
        <li><a href="#social">社交平台</a></li>
      </ul>
    </nav>
  </header>

  <main>

    <!-- 首屏 / 封面（背景圖可換路徑） -->
    <section id="about" class="about">
      <h2>新義和歌劇團</h2>
      <p>傳統骨，年輕魂 —— 戲曲潮牌・新義和</p>
    </section>

    <!-- 歷代人物（三張並排，滑過顯示標題） -->
    <section id="history" class="history">
      <h2 class="section-title section-title--bar">新義和歌劇團歷代人物</h2>

      <figure class="person-card">
        <img src="./img/老團長.jpg" alt="第一代：江張卻女士（老團長）">
        <figcaption class="caption">第一代：江張卻女士（老團長）</figcaption>
      </figure>

      <figure class="person-card">
        <img src="./img/編劇.jpg" alt="第一代：江春金（編劇）">
        <figcaption class="caption">第一代：江春金（編劇）</figcaption>
      </figure>

      <figure class="person-card">
        <img src="./img/苦旦.jpg" alt="第二代：江郁茹（苦旦）">
        <figcaption class="caption">第二代：江郁茹（苦旦）</figcaption>
      </figure>
    </section>

    <!-- 結語：桌機左圖右文；手機圖上文下 -->
    <section class="conclusion">
      <figure class="conclusion-media">
        <img src="./img/logo.png" alt="新義和歌劇團 LOGO">
        <figcaption class="tagline">傳統與創新並行，讓戲曲走進每個人的生活。</figcaption>
      </figure>

      <div class="conclusion-text">
        <p>新義和歌劇團，源自傳統、勇於創新。我們走進廟埕，唱出老觀眾的回憶，也走進年輕人的心裡，用戲曲說現在的故事。</p>
        <p>無論你是從小看戲長大的老朋友，還是第一次接觸戲曲的年輕人，新義和都邀你一起——看戲、聽曲、品人生。</p>
      </div>
    </section>

    <!-- 聯絡表單（僅示意；提交後動作由你決定） -->
    <section id="contact" class="contact">
      <h2>聯絡我！</h2>
      <p>讓我們合作。 ❤</p>

      <form class="form" id="contactForm">
        <input type="text" id="name" name="name" placeholder="姓名" required>
        <input type="email" id="email" name="email" placeholder="電子信箱" required>
        <textarea id="message" name="message" placeholder="訊息"></textarea>
        <button type="submit">送出</button>
      </form>
    </section>

    <!-- 社群 -->
    <div id="social" class="social">
      <a href="https://www.facebook.com/" target="_blank" class="icon" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
      <a href="https://www.instagram.com/" target="_blank" class="icon" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
      <a href="mailto:goxyh2012@gmail.com" class="icon" aria-label="Email"><i class="fas fa-envelope"></i></a>
      <a href="https://line.me/" target="_blank" class="icon" aria-label="LINE"><i class="fab fa-line"></i></a>
    </div>

  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-line">
        <h2 class="footer-title">聯絡資訊</h2>
        <div class="footer-info">
          <p>團長：江敏琛</p>
          <p>電話：0971-220-890</p>
          <p>電子信箱：<a href="mailto:goxyh2012@gmail.com">goxyh2012@gmail.com</a></p>
        </div>
      </div>
    </div>
  </footer>

  <!-- 背景音樂（檔案路徑請改成你的） -->
  <audio id="bgm" src="./audio/bgm.mp3" loop preload="metadata" playsinline></audio>
  <button type="button" class="bgm-unlock" id="bgmUnlock" hidden aria-label="點一下開啟音樂">▶ 點一下開啟音樂</button>

  <!-- JS：漢堡 + 首次點擊自動展開 + 封面淡化 + BGM（iOS/Android 兼容） -->
  <script>
  (function(){
    /* ========= 漢堡選單 ========= */
    const nav    = document.getElementById('siteNav')  || document.querySelector('.site-nav');
    const toggle = document.getElementById('navToggle')|| document.querySelector('.nav-toggle');
    const body   = document.body;

    const isMobile = () => window.matchMedia('(max-width: 768px)').matches;

    function openNav(){
      if (!nav || !toggle) return;
      nav.classList.add('is-open');
      toggle.setAttribute('aria-expanded','true');
      body.classList.add('nav-open','no-scroll'); // 封面變暗 + 鎖滾動
    }
    function closeNav(){
      if (!nav || !toggle) return;
      nav.classList.remove('is-open');
      toggle.setAttribute('aria-expanded','false');
      body.classList.remove('nav-open','no-scroll');
    }

    if (toggle) {
      toggle.addEventListener('click', (e) => {
        e.preventDefault();
        nav.classList.contains('is-open') ? closeNav() : openNav();
      });
    }

    // 首次點擊（手機）自動展開，讓長輩直接看到選單
    let autoOpened = false;
    const firstTapOpen = (e) => {
      if (autoOpened || !isMobile()) return;
      // 忽略：點到漢堡鈕、選單、BGM按鈕
      if (e.target.closest('#navToggle, .nav-toggle, #siteNav, .site-nav, #bgmUnlock')) return;
      autoOpened = true;
      openNav();
      document.removeEventListener('pointerdown', firstTapOpen, true);
    };
    document.addEventListener('pointerdown', firstTapOpen, true);

    // 點選單連結（手機）後自動收起
    if (nav) {
      nav.addEventListener('click', (e) => {
        if (isMobile() && e.target.closest('a')) closeNav();
      });
    }

    // 視窗變寬（回桌機）自動收起手機狀態
    window.addEventListener('resize', () => {
      if (!isMobile() && nav && nav.classList.contains('is-open')) closeNav();
    });

    // 錨點距離（避免被固定 header 蓋住）
    document.querySelectorAll('section[id]').forEach(sec => sec.style.scrollMarginTop = '88px');
  })();

  (function(){
    /* ========= 背景音樂（iOS/Android 友善） ========= */
    const audio = document.getElementById('bgm');
    const btn   = document.getElementById('bgmUnlock');
    if (!audio || !btn) return;

    audio.playsInline = true;   // iOS/Android WebView 友善
    audio.muted = false;
    audio.volume = 1;

    // 進站嘗試自動播放；若被擋 → 顯示按鈕
    try {
      const p = audio.play();
      if (p && p.catch) p.catch(() => { btn.hidden = false; });
    } catch { btn.hidden = false; }

    // 解鎖播放（綁多種手勢事件，最大化相容）
    const unlock = (e) => {
      if (e && e.preventDefault) e.preventDefault();
      if (audio.readyState < 2) audio.load();
      audio.currentTime = 0;
      audio.muted = false;
      try { audio.play(); } catch(_){}

      const onPlaying = () => { btn.hidden = true; cleanup(); };
      const onError   = () => { btn.hidden = false; cleanup(); };
      const cleanup   = () => {
        audio.removeEventListener('playing', onPlaying);
        audio.removeEventListener('error',   onError);
      };
      audio.addEventListener('playing', onPlaying, { once:true });
      audio.addEventListener('error',   onError,   { once:true });
    };
    ['click','touchend','pointerup'].forEach(evt=>{
      btn.addEventListener(evt, unlock, { passive:false });
    });

    // 備援：第一次點頁面其他地方也啟動（只跑一次）
    const bootOnce = (e) => { unlock(e); window.removeEventListener('pointerdown', bootOnce); };
    window.addEventListener('pointerdown', bootOnce, { once:true, passive:false });

    // 循環保險
    audio.addEventListener('ended', () => {
      try { audio.currentTime = 0; audio.play(); } catch(_){}
    });

    // 前景/背景管理
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState !== 'visible') {
        if (!audio.paused) audio.pause();
      } else {
        if (audio.paused && btn.hidden) {
          audio.play().catch(() => { btn.hidden = false; });
        }
      }
    });
    window.addEventListener('pagehide', () => { if (!audio.paused) audio.pause(); });
  })();
  </script>
</body>
</html>
