  <main class="profile">

      <img src="./img/苦旦.jpg" alt="第二代：江郁茹" class="profile-photo" />
      <h1>第二代：江郁茹（青衣）</h1>
    </section>

    <section class="profile-content">
      <p>
        第二代江郁茹女士，承繼母親對歌仔戲的赤誠與深情，自幼浸潤梨園芬芳，於台中「劉文和歌劇團」啟蒙學藝。其後四十餘載的舞台歲月，她足跡遍及「正新麗園」、「春明歌劇團」、「新藝芳歌劇團」、「新和興總團」、「葉麗珠歌劇團」、「日明小江歌劇團」、「鴻明歌劇團」等各大劇團，皆以當家台柱之姿，綻放異彩。
      </p>
      <p>
        專攻旦行的她，唱念之間婉轉動人，舉手投足盡是風華，演技細膩傳神，往往一顰一笑，皆能撥動人心。她以無數經典角色，為歌仔戲的舞台留下燦爛痕跡，並以真摯深情贏得廣大戲迷的傾心與敬仰。
      </p>
    </section>

    <div class="back-home">
      <a href="./index.html" class="btn-back">← 返回首頁</a>

  <script>
  (function(){
    const dlg = document.getElementById('albumDialog');
    const openBtn = document.getElementById('openAlbum');
    const closeBtn = document.getElementById('closeAlbum');
  
    // 開啟
    openBtn.addEventListener('click', () => {
      if (!dlg.open) dlg.showModal();
    });
  
    // ✅ 後備：即使沒有 method="dialog"，也用 JS 關閉
    closeBtn.addEventListener('click', (e) => {
      // 如果是 form method="dialog" 會自動 close；這裡再保險一次
      if (typeof dlg?.open !== "undefined" && dlg.open) dlg.close();
    });
  
    // ✅ Esc 熱鍵也能關
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && dlg.open) dlg.close();
    });
  
    // 你原本的 Lightbox 相關程式…
    // 注意：打開燈箱前要關 dialog（避免擋住）
    function openLightbox(i){
      if (dlg.open) dlg.close();  // ← 關鍵
      // ... 顯示燈箱的原本邏輯
    }
  
    // 其他既有程式碼略…
  })();
