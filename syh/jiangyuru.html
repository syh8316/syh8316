<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>第二代：江郁茹｜新義和歌劇團</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- 全站樣式（導覽列、字體等） -->
  <link rel="stylesheet" href="total.css" />
  <link rel="stylesheet" href="phone.css" />
  <!-- 參考活動頁的相簿/燈箱規格 -->
  <link rel="stylesheet" href="activities.css" />
  <!-- 本頁樣式（覆蓋/補充） -->
  <link rel="stylesheet" href="jiangyuru_style.css" />
</head>
<body>
  <!-- 導覽列：移除所有導覽連結，只保留品牌與「相簿」按鈕 -->
  <header class="site-header">
    <h1 class="brand"><span class="brand__text">新義和歌劇團</span></h1>
    <a id="openAlbum" class="album-btn" href="javascript:void(0)" aria-haspopup="dialog" aria-controls="albumDialog">相簿</a>
  </header>

  <!-- 內容 -->
  <main class="profile reveal">
    <section class="profile-header">
      <img src="./img/苦旦.jpg" alt="第二代：江郁茹" class="profile-photo" />
      <h1>第二代：江郁茹（青衣）</h1>
    </section>

    <section class="profile-content">
      <p>
        第二代江郁茹女士，承繼母親對歌仔戲的赤誠與深情，自幼浸潤梨園芬芳，於台中「劉文和歌劇團」啟蒙學藝。其後四十餘載的舞台歲月，她足跡遍及「正新麗園」、「春明歌劇團」、「新藝芳歌劇團」、「新和興總團」、「葉麗珠歌劇團」、「日明小江歌劇團」、「鴻明歌劇團」等各大劇團，皆以當家台柱之姿，綻放異彩。
      </p>
      <p>
        專攻旦行的她，唱念之間婉轉動人，舉手投足盡是風華，演技細膩傳神，往往一顰一笑，皆能撥動人心。她以無數經典角色，為歌仔戲的舞台留下燦爛痕跡，並以真摯深情贏得廣大戲迷的傾心與敬仰。
      </p>
    </section>

    <!-- 🔙 返回首頁 -->
    <div class="back-home">
      <a href="index.html" class="btn-back">← 返回首頁</a>
    </div>
  </main>

  <!-- 相簿 Dialog（規格沿用活動頁：.event-dialog + .gallery-grid + .lightbox） -->
  <dialog id="albumDialog" class="event-dialog" aria-label="江郁茹相簿">
    <button class="close" id="closeAlbum" aria-label="關閉">關閉</button>
    <div class="dialog-body">
      <h3 style="margin:.2rem 0 1rem;">相簿</h3>
      <!-- 縮圖網格（可自由增減圖片） -->
      <div class="gallery-grid" id="albumGrid">
        <!-- 範例：請換成你的實際路徑 -->
        <a href="./img/album/jiangyuru_01.jpg" data-index="0"><img src="./img/album/jiangyuru_01.jpg" alt="舞台照 1" loading="lazy" /></a>
        <a href="./img/album/jiangyuru_02.jpg" data-index="1"><img src="./img/album/jiangyuru_02.jpg" alt="舞台照 2" loading="lazy" /></a>
        <a href="./img/album/jiangyuru_03.jpg" data-index="2"><img src="./img/album/jiangyuru_03.jpg" alt="舞台照 3" loading="lazy" /></a>
        <a href="./img/album/jiangyuru_04.jpg" data-index="3"><img src="./img/album/jiangyuru_04.jpg" alt="舞台照 4" loading="lazy" /></a>
      </div>
    </div>
  </dialog>

  <!-- Lightbox（沿用活動頁的 class 命名） -->
  <div class="lightbox" id="lightbox" hidden>
    <img class="lb-img" id="lbImg" alt="" />
    <button class="lb-prev" id="lbPrev" aria-label="上一張">‹</button>
    <button class="lb-next" id="lbNext" aria-label="下一張">›</button>
    <button class="lb-close" id="lbClose" aria-label="關閉">關閉</button>
    <div class="lb-counter" id="lbCounter">1 / 1</div>
  </div>

  <!-- 頁尾 -->
  <footer class="site-footer">
    <div class="footer-line">
      <p class="footer-title">新義和歌劇團</p>
      <div class="footer-info">
        <p>© 新義和歌劇團</p>
      </div>
    </div>
  </footer>

  <!-- Minimal JS：開關相簿 Dialog + Lightbox 功能 -->
  <script>
    (function(){
      const dlg = document.getElementById('albumDialog');
      const openBtn = document.getElementById('openAlbum');
      const closeBtn = document.getElementById('closeAlbum');

      openBtn.addEventListener('click', () => dlg.showModal());
      closeBtn.addEventListener('click', () => dlg.close());
      dlg.addEventListener('click', (e) => {
        if (e.target === dlg) dlg.close(); // 點透明處關閉
      });

      // Lightbox
      const grid = document.getElementById('albumGrid');
      const lb = document.getElementById('lightbox');
      const lbImg = document.getElementById('lbImg');
      const lbPrev = document.getElementById('lbPrev');
      const lbNext = document.getElementById('lbNext');
      const lbClose = document.getElementById('lbClose');
      const lbCounter = document.getElementById('lbCounter');

      const thumbs = Array.from(grid.querySelectorAll('a'));
      const sources = thumbs.map(a => a.getAttribute('href'));
      let idx = 0;

      function show(i){
        idx = (i + sources.length) % sources.length;
        lbImg.src = sources[idx];
        lbCounter.textContent = (idx+1) + ' / ' + sources.length;
      }

      grid.addEventListener('click', (e) => {
        const a = e.target.closest('a');
        if(!a) return;
        e.preventDefault();
        show(Number(a.dataset.index) || 0);
        lb.hidden = false;
      });

      lbPrev.addEventListener('click', () => show(idx - 1));
      lbNext.addEventListener('click', () => show(idx + 1));
      lbClose.addEventListener('click', () => lb.hidden = true);
      lb.addEventListener('click', (e) => {
        if(e.target === lb) lb.hidden = true;
      });
      window.addEventListener('keydown', (e) => {
        if(lb.hidden) return;
        if(e.key === 'Escape') lb.hidden = true;
        if(e.key === 'ArrowLeft') show(idx - 1);
        if(e.key === 'ArrowRight') show(idx + 1);
      });
    })();
  </script>
</body>
</html>
